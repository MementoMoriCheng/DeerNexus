# Dependabot — ci-cd.md §9「依赖版本锁定」+ §19.6「依赖更新」, baseline §13.1.
#
# Four ecosystems cover the full dependency surface: backend (pip via uv), frontend
# (npm), base images (docker, now digest-pinned by PR-066 so Dependabot proposes digest
# bumps), and GitHub Actions (SHA-pinned by PR-066 so Dependabot tracks new releases).
#
# NOTE on pip ecosystem: Dependabot resolves `backend/pyproject.toml` and updates
# `backend/uv.lock` via its uv integration. If the uv-lock update proves unreliable
# in practice (upstream limitation), the docker + github-actions ecosystems still
# keep base images and Actions current; the pip ecosystem can be removed in a
# follow-up without affecting the others.

version: 2
updates:
  # Backend Python deps — pyproject.toml + uv.lock
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    reviewers:
      - MementoMoriCheng
    commit-message:
      prefix: chore(deps)
      include: scope
    groups:
      python-minor:
        update-types:
          - minor
          - patch

  # Frontend npm deps — package.json + pnpm-lock.yaml
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    reviewers:
      - MementoMoriCheng
    commit-message:
      prefix: chore(deps)
      include: scope
    groups:
      npm-minor:
        update-types:
          - minor
          - patch

  # Base images — backend + frontend Dockerfiles (digest bumps, PR-066 pinned them).
  # Base-image MAJOR jumps are gated: a runtime language bump (python 3.12→3.14,
  # node 22→26) skips untested compatibility windows for the whole dependency tree
  # and CI does NOT run tests inside the image (tests use setup-python/setup-node).
  # So we pin to the current line and require a deliberate, tested upgrade PR.
  # See PR-066 follow-up: dependabot first round proposed node 26 / python 3.14
  # which were closed as too aggressive.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    reviewers:
      - MementoMoriCheng
    commit-message:
      prefix: chore(deps)
      include: scope
    ignore:
      # Pin python to 3.12.x — 3.13 removed stdlib modules and the backend dep tree
      # (LangGraph/SQLAlchemy/FastAPI/pydantic) needs a tested migration. Allow
      # only patch within 3.12; a 3.13 move is a deliberate PR.
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    reviewers:
      - MementoMoriCheng
    commit-message:
      prefix: chore(deps)
      include: scope
    ignore:
      # Pin node to 22.x (current LTS line). Node odd versions (23/25) are non-LTS;
      # node 26 is not LTS. A move to the next LTS (24) needs full frontend
      # re-verification (Next.js/React/pnpm). Allow only patch within 22.
      - dependency-name: node
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # GitHub Actions — workflows + the action called by sbom-and-scan/codeql/etc.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    reviewers:
      - MementoMoriCheng
    commit-message:
      prefix: chore(deps)
      include: scope
    groups:
      actions-minor:
        update-types:
          - minor
          - patch
